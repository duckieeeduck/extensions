name: ScreenOCR Windows native verification
on:
  push:
    branches: [test/screenocr-windows-cloud]
permissions:
  contents: read
jobs:
  native:
    name: Native OCR on Windows 11 ARM
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: duckieeeduck/extensions
          ref: ${{ github.sha }}
          sparse-checkout: extensions/screenocr
          persist-credentials: false
      - name: Record Windows and PowerShell environment
        shell: powershell
        run: |
          $PSVersionTable
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          Get-WindowsCapability -Online | Where-Object Name -Like 'Language.OCR*' | Format-Table Name, State
      - name: Require English OCR capability
        shell: powershell
        run: |
          $capability = Get-WindowsCapability -Online -Name 'Language.OCR~~~en-US~0.0.1.0'
          if ($capability.State -ne 'Installed') {
            $result = Add-WindowsCapability -Online -Name 'Language.OCR~~~en-US~0.0.1.0'
            if ($result.RestartNeeded) { throw 'OCR capability requires a restart; this run cannot certify recognition.' }
          }
      - name: Verify regression fails on previous PR helper
        shell: powershell
        run: |
          $helper = 'extensions/screenocr/assets/ocr.ps1'
          $backup = Join-Path $env:RUNNER_TEMP 'screenocr-fixed.ps1'
          Copy-Item $helper $backup
          try {
            Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/duckieeeduck/extensions/24214b96f3e8bc86bb2fdeaca32c3f376d6f8755/extensions/screenocr/assets/ocr.ps1' -OutFile $helper
            $output = & powershell.exe -NoLogo -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File extensions/screenocr/tests/windows-native.ps1 -RequireOcr
            $code = $LASTEXITCODE
            $output | Write-Output
            if ($code -eq 0 -or ($output -join "`n") -notmatch 'RESULT pass=13 fail=1 skip=0' -or ($output -join "`n") -notmatch 'FAIL another process can capture while the first bitmap is being recognized') {
              throw 'The baseline did not reproduce exactly the expected lock-lifetime regression.'
            }
          } finally { Copy-Item $backup $helper -Force }
          exit 0
      - name: Run shipped PowerShell tests with real OCR required
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File extensions/screenocr/tests/windows-native.ps1 -RequireOcr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
