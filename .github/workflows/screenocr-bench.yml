name: ScreenOCR helper timing (fork only)
on:
  workflow_dispatch:
  push:
    branches: ["ci/screenocr-bench"]
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extensions/screenocr
      - name: Time published vs PR helper
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File extensions/screenocr/bench/bench.ps1 -Runs 7
